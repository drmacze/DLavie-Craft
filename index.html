  <script>
    (function(){
      'use strict';

      var appStarted=false,enhStarted=false;
      function loadEnh(){if(enhStarted)return;enhStarted=true;var s=document.createElement('script');s.src='/DLavie-Craft/assets/app-bootstrap-v1.js?v=20260907h2';s.defer=true;document.body.appendChild(s)}

        if(root&&window.MutationObserver){var m=new MutationObserver(function(){if(root.childElementCount){m.disconnect();loadEnh()}});m.observe(root,{childList:true,subtree:true})}
        setTimeout(function(){if(!root.childElementCount&&fail&&!window.__DLAVIE_WELCOME_ACTIVE__)fail.classList.add('show')},9000)
      }
      window.__DLAVIE_BOOT_APP__=function(){

        var l=document.createElement('link');l.rel='stylesheet';l.href='/DLavie-Craft/assets/index-BLlJjh3N.css';document.head.appendChild(l);
        var s=document.createElement('script');s.type='module';s.src='/DLavie-Craft/assets/index-DQVRunOM.js';s.onload=watchRoot;s.onerror=function(){if(fail&&!window.__DLAVIE_WELCOME_ACTIVE__)fail.classList.add('show')};document.head.appendChild(s);
        watchRoot()

      if(!window.__DLAVIE_WELCOME_ACTIVE__)window.__DLAVIE_BOOT_APP__()

  <script>
    (function(){
      'use strict';
      var host=document.getElementById('dl-welcome-v8');if(!host)return;
      if(!window.__DLAVIE_WELCOME_ACTIVE__){host.remove();return}
      var KEY='dlavie:welcome:v8',THRESHOLD=.62,SLIDE_MS=5200,RESUME_MS=6500;
      var viewport=host.querySelector('.dlw8-viewport'),slides=[].slice.call(host.querySelectorAll('.dlw8-slide')),dots=[].slice.call(host.querySelectorAll('[data-dot]')),copyBox=host.querySelector('.dlw8-copy'),title=copyBox.querySelector('h1'),body=copyBox.querySelector('p'),start=host.querySelector('.dlw8-start'),knob=start.querySelector('.dlw8-knob'),label=start.querySelector('strong');
      var text=[['Temukan mod yang selalu kamu cari.','Jelajahi mod, add-on, map, skin, shader dan project Minecraft pilihan dalam satu tempat.'],['Bangun dan bagikan duniamu.','Temukan karya komunitas atau aktifkan akun Crafter untuk mempublikasikan projectmu sendiri.'],['Mainkan lebih banyak, gratis.','Simpan favorit, download build terbaru, beri rating dan temukan creator baru.']];
      var index=0,timer=0,resume=0,leaving=false,progress=0,touchId=null,pointerId=null,dragRect=null;

      function w(){return Math.max(1,viewport.clientWidth)}
      function paint(i){i=Math.max(0,Math.min(slides.length-1,i));index=i;slides.forEach(function(s,n){s.classList.toggle('active',n===i)});dots.forEach(function(d,n){d.classList.toggle('active',n===i)});title.textContent=text[i][0];body.textContent=text[i][1]}
      function go(i,manual){i=(i+slides.length)%slides.length;paint(i);try{viewport.scrollTo({left:i*w(),behavior:'smooth'})}catch(e){viewport.scrollLeft=i*w()}manual?pause():restart()}
      function restart(){clearTimeout(timer);timer=setTimeout(function(){go(index+1,false)},SLIDE_MS)}
      function pause(){clearTimeout(timer);clearTimeout(resume);resume=setTimeout(restart,RESUME_MS)}
      viewport.addEventListener('scroll',function(){var n=Math.round(viewport.scrollLeft/w());if(n!==index)paint(n)},{passive:true});
      viewport.addEventListener('touchstart',pause,{passive:true});
      dots.forEach(function(d,i){d.addEventListener('click',function(){go(i,true)})});
      function render(p,animate){
        progress=clamp(p);start.style.setProperty('--p',String(progress));start.setAttribute('aria-valuenow',String(Math.round(progress*100)));
        var travel=Math.max(0,start.clientWidth-knob.offsetWidth-10);knob.style.transition=animate?'transform .22s cubic-bezier(.22,.8,.2,1),background .18s ease':'none';knob.style.transform='translate3d('+(travel*progress)+'px,0,0)';
        start.classList.toggle('ready',progress>=THRESHOLD);label.textContent=progress>=THRESHOLD?'Lepas untuk masuk':(progress>.08?'Terus geser…':'Swipe to Start')
      }
      function begin(x){if(leaving)return;clearTimeout(timer);clearTimeout(resume);dragRect=start.getBoundingClientRect();start.classList.add('dragging');render(0,false);move(x)}
      function move(x){if(!dragRect)return;var p=(x-dragRect.left-27)/Math.max(1,dragRect.width-54);render(p,false)}
      function reset(){touchId=null;pointerId=null;dragRect=null;start.classList.remove('dragging','ready');render(0,true);restart()}
      function release(){if(!dragRect)return;var ok=progress>=THRESHOLD;touchId=null;pointerId=null;dragRect=null;start.classList.remove('dragging');if(ok)finish();else reset()}
      function findTouch(list,id){if(!list)return null;for(var i=0;i<list.length;i++)if(list[i].identifier===id)return list[i];return null}
      start.addEventListener('touchstart',function(e){if(leaving||touchId!==null)return;var t=e.changedTouches&&e.changedTouches[0];if(!t)return;if(e.cancelable)e.preventDefault();touchId=t.identifier;begin(t.clientX)},{passive:false});
      document.addEventListener('touchmove',function(e){if(touchId===null)return;var t=findTouch(e.touches,touchId);if(!t)return;if(e.cancelable)e.preventDefault();move(t.clientX)},{passive:false,capture:true});
      document.addEventListener('touchend',function(e){if(touchId===null)return;var t=findTouch(e.changedTouches,touchId);if(!t)return;if(e.cancelable)e.preventDefault();release()},{passive:false,capture:true});
      document.addEventListener('touchcancel',function(e){if(touchId===null)return;reset()},{passive:true,capture:true});
      if(window.PointerEvent){
        start.addEventListener('pointerdown',function(e){if(e.pointerType==='touch'||(e.pointerType==='mouse'&&e.button!==0)||leaving||pointerId!==null)return;e.preventDefault();pointerId=e.pointerId;begin(e.clientX)});
        document.addEventListener('pointermove',function(e){if(pointerId===null||e.pointerId!==pointerId||e.pointerType==='touch')return;move(e.clientX)});
        document.addEventListener('pointerup',function(e){if(pointerId===null||e.pointerId!==pointerId||e.pointerType==='touch')return;release()});
        document.addEventListener('pointercancel',function(e){if(pointerId===null||e.pointerId!==pointerId||e.pointerType==='touch')return;reset()})
      }
      start.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '||e.key==='ArrowRight'){e.preventDefault();finish()}});
      function removeForce(){try{var u=new URL(location.href);u.searchParams.delete('welcome');history.replaceState(history.state,'',u.pathname+(u.search||'')+(location.hash||'#/'))}catch(e){}}
      function exitWelcome(){host.classList.add('leaving');document.documentElement.classList.add('dlw8-enter');setTimeout(function(){if(host.parentNode)host.parentNode.removeChild(host);window.__DLAVIE_WELCOME_ACTIVE__=false;document.documentElement.classList.remove('dlw8-on','dlw8-enter');document.documentElement.classList.add('dlw8-off');try{window.dispatchEvent(new CustomEvent('dlavie:welcome-complete'))}catch(e){}},440)}
      function finish(){
        if(leaving)return;leaving=true;clearTimeout(timer);clearTimeout(resume);start.classList.remove('dragging');render(1,true);label.textContent='Membuka DLavie…';
        try{localStorage.setItem(KEY,'done')}catch(e){}removeForce();if(window.__DLAVIE_BOOT_APP__)window.__DLAVIE_BOOT_APP__();
        var waited=0,iv=setInterval(function(){waited+=70;if((document.getElementById('root')&&document.getElementById('root').childElementCount)||waited>=2100){clearInterval(iv);exitWelcome()}},70)
      }

    })();
