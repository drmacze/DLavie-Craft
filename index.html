  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050608;color:#fff}body{min-height:100vh;min-height:100dvh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}#root{min-height:100vh;background:#050608}#dl-app-fail{display:none;position:fixed;z-index:100;left:18px;right:18px;bottom:20px;max-width:420px;margin:auto;padding:13px 14px;border:1px solid rgba(255,255,255,.12);border-radius:16px;background:rgba(12,12,17,.95);color:#fff;box-shadow:0 16px 44px rgba(0,0,0,.34);align-items:center;justify-content:space-between;gap:12px}#dl-app-fail.show{display:flex}#dl-app-fail span{font-size:11px;line-height:1.4;color:rgba(255,255,255,.72)}#dl-app-fail button{border:0;border-radius:999px;padding:9px 12px;background:#fff;color:#08090c;font-weight:800}
  </style>
  <link rel="stylesheet" href="/DLavie-Craft/assets/welcome-first-v8.css?v=20260907w23" />
  <script>
    (function(){
      var show=true;
      try{
        var h=location.hash||'',home=h===''||h==='#'||h==='#/';
        var force=(new URLSearchParams(location.search)).get('welcome')==='1';
        var done=false;try{done=localStorage.getItem('dlavie:welcome:v8')==='done'}catch(e){}
        show=home&&(force||!done);
      }catch(e){}
      window.__DLAVIE_WELCOME_ACTIVE__=show;
      document.documentElement.classList.add(show?'dlw8-on':'dlw8-off');
    })();
  </script>

<body>
  <div id="dl-welcome-v8" aria-label="Welcome to DLavie Craft">
    <div class="dlw8-frame">
      <div class="dlw8-viewport" aria-label="Welcome slides">
        <div class="dlw8-track">
          <section class="dlw8-slide active" data-slide="0"><div class="dlw8-stars"></div><div class="dlw8-word">DLAVIE</div><div class="dlw8-shade"></div></section>
          <section class="dlw8-slide" data-slide="1"><div class="dlw8-stars"></div><div class="dlw8-word">MINECRAFT</div><div class="dlw8-shade"></div></section>
          <section class="dlw8-slide" data-slide="2"><div class="dlw8-stars"></div><div class="dlw8-word">ADDON</div><div class="dlw8-shade"></div></section>
        </div>
      </div>
      <div class="dlw8-copy" aria-live="polite"><h1>Temukan mod yang selalu kamu cari.</h1><p>Jelajahi mod, add-on, map, skin, shader dan project Minecraft pilihan dalam satu tempat.</p></div>
      <div class="dlw8-dots" aria-hidden="true"><button type="button" class="active" data-dot="0" tabindex="-1"></button><button type="button" data-dot="1" tabindex="-1"></button><button type="button" data-dot="2" tabindex="-1"></button></div>
      <div class="dlw8-start" role="slider" tabindex="0" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Geser ke kanan untuk masuk ke Home">
        <div class="dlw8-fill"></div><div class="dlw8-knob">→</div><strong>Swipe to Start</strong>
      </div>
    </div>
  </div>

  <div id="root"></div>
  <div id="dl-app-fail"><span>DLavie belum berhasil dimuat.</span><button type="button" onclick="location.reload()">Muat ulang</button></div>

  <script>
    (function(){
      'use strict';
      var root=document.getElementById('root'),fail=document.getElementById('dl-app-fail');
      var appStarted=false,enhStarted=false;
      function loadEnh(){if(enhStarted)return;enhStarted=true;var s=document.createElement('script');s.src='/DLavie-Craft/assets/app-bootstrap-v1.js?v=20260907h3';s.defer=true;document.body.appendChild(s)}
      function watchRoot(){
        if(root&&root.childElementCount){loadEnh();return}
        if(root&&window.MutationObserver){var m=new MutationObserver(function(){if(root.childElementCount){m.disconnect();loadEnh()}});m.observe(root,{childList:true,subtree:true})}
        setTimeout(function(){if(!root.childElementCount&&fail&&!window.__DLAVIE_WELCOME_ACTIVE__)fail.classList.add('show')},9000)
      }
      window.__DLAVIE_BOOT_APP__=function(){
        if(appStarted)return;appStarted=true;
        var l=document.createElement('link');l.rel='stylesheet';l.href='/DLavie-Craft/assets/index-BLlJjh3N.css';document.head.appendChild(l);
        var s=document.createElement('script');s.type='module';s.src='/DLavie-Craft/assets/index-DQVRunOM.js';s.onload=watchRoot;s.onerror=function(){if(fail&&!window.__DLAVIE_WELCOME_ACTIVE__)fail.classList.add('show')};document.head.appendChild(s);
        watchRoot()
      };
      if(!window.__DLAVIE_WELCOME_ACTIVE__)window.__DLAVIE_BOOT_APP__()
    })();
  </script>

  <script>
    (function(){
      'use strict';
      var host=document.getElementById('dl-welcome-v8');if(!host)return;
      if(!window.__DLAVIE_WELCOME_ACTIVE__){host.remove();return}

      var KEY='dlavie:welcome:v8',THRESHOLD=.93;
      var frame=host.querySelector('.dlw8-frame'),viewport=host.querySelector('.dlw8-viewport'),track=host.querySelector('.dlw8-track'),slides=[].slice.call(host.querySelectorAll('.dlw8-slide')),dots=[].slice.call(host.querySelectorAll('[data-dot]')),copyBox=host.querySelector('.dlw8-copy'),title=copyBox.querySelector('h1'),body=copyBox.querySelector('p'),start=host.querySelector('.dlw8-start'),knob=start.querySelector('.dlw8-knob'),label=start.querySelector('strong');
      var copy=[
        ['Temukan mod yang selalu kamu cari.','Jelajahi mod, add-on, map, skin, shader dan project Minecraft pilihan dalam satu tempat.'],
        ['Minecraft, dibuat lebih luas.','Cari pengalaman baru, simpan favorit dan temukan karya komunitas yang cocok untuk permainanmu.'],
        ['Addon yang siap dimainkan.','Temukan build terbaru, creator baru dan project yang bisa langsung kamu bawa ke Minecraft.']
      ];
      var progress=0,visualIndex=0,leaving=false,dragging=false,startX=0,dragTravel=1,pointerId=null,copyToken=0;

      function clamp(v){return Math.max(0,Math.min(1,v))}
      function width(){return Math.max(1,viewport.clientWidth||window.innerWidth||1)}
      function indexFor(p){return Math.max(0,Math.min(slides.length-1,Math.round(clamp(p)*(slides.length-1))))}
      function setCopy(i){
        if(i===visualIndex&&title.textContent===copy[i][0])return;
        visualIndex=i;slides.forEach(function(s,n){s.classList.toggle('active',n===i)});dots.forEach(function(d,n){d.classList.toggle('active',n===i)});
        var token=++copyToken;copyBox.classList.add('changing');
        setTimeout(function(){if(token!==copyToken)return;title.textContent=copy[i][0];body.textContent=copy[i][1];copyBox.classList.remove('changing')},75)
      }
      function setScene(p,animate){
        progress=clamp(p);
        var px=-(slides.length-1)*width()*progress;
        track.style.transition=animate?'transform .46s cubic-bezier(.22,.8,.2,1)':'none';
        track.style.transform='translate3d('+px+'px,0,0)';
        setCopy(indexFor(progress))
      }
      function render(p,animate){
        progress=clamp(p);start.style.setProperty('--p',String(progress));start.setAttribute('aria-valuenow',String(Math.round(progress*100)));
        var travel=Math.max(1,start.clientWidth-knob.offsetWidth-10);
        knob.style.transition=animate?'transform .28s cubic-bezier(.22,.8,.2,1),background .18s ease,color .18s ease':'none';
        knob.style.transform='translate3d('+(travel*progress)+'px,0,0)';
        start.classList.toggle('ready',progress>=THRESHOLD);
        label.textContent=progress>=THRESHOLD?'Lepas untuk masuk':(progress>.06?'Terus geser…':'Swipe to Start');
        setScene(progress,animate)
      }
      function prewarm(){try{if(window.__DLAVIE_BOOT_APP__)window.__DLAVIE_BOOT_APP__()}catch(e){}}
      function begin(x){
        if(leaving||dragging)return;
        prewarm();
        dragging=true;startX=x;dragTravel=Math.max(1,start.clientWidth-knob.offsetWidth-10);pointerId=null;
        frame.classList.add('scrubbing');start.classList.add('dragging');
        render(0,false)
      }
      function move(x){if(!dragging)return;render((x-startX)/dragTravel,false)}
      function reset(){
        dragging=false;pointerId=null;frame.classList.remove('scrubbing');start.classList.remove('dragging','ready');
        render(0,true)
      }
      function release(){
        if(!dragging)return;
        var complete=progress>=THRESHOLD;
        dragging=false;pointerId=null;frame.classList.remove('scrubbing');start.classList.remove('dragging');
        if(complete)finish();else reset()
      }

      function onTouchMove(e){if(!dragging)return;var t=e.touches&&e.touches[0];if(!t)return;if(e.cancelable)e.preventDefault();move(t.clientX)}
      function onTouchEnd(e){if(!dragging)return;if(e.cancelable)e.preventDefault();release()}
      function onTouchCancel(){if(dragging)reset()}

      start.addEventListener('touchstart',function(e){if(leaving||dragging)return;var t=e.touches&&e.touches[0];if(!t)return;if(e.cancelable)e.preventDefault();begin(t.clientX)},{passive:false});
      document.addEventListener('touchmove',onTouchMove,{passive:false,capture:true});
      document.addEventListener('touchend',onTouchEnd,{passive:false,capture:true});
      document.addEventListener('touchcancel',onTouchCancel,{passive:true,capture:true});

      function onPointerMove(e){if(!dragging||pointerId===null||e.pointerId!==pointerId||e.pointerType==='touch')return;move(e.clientX)}
      function onPointerUp(e){if(!dragging||pointerId===null||e.pointerId!==pointerId||e.pointerType==='touch')return;release()}
      function onPointerCancel(e){if(dragging&&pointerId!==null&&e.pointerId===pointerId)reset()}
      if(window.PointerEvent){
        start.addEventListener('pointerdown',function(e){if(e.pointerType==='touch'||leaving||dragging||(e.pointerType==='mouse'&&e.button!==0))return;e.preventDefault();begin(e.clientX);pointerId=e.pointerId;try{start.setPointerCapture(e.pointerId)}catch(x){} });
        document.addEventListener('pointermove',onPointerMove);
        document.addEventListener('pointerup',onPointerUp);
        document.addEventListener('pointercancel',onPointerCancel)
      }

      start.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '||e.key==='ArrowRight'){e.preventDefault();finish()}});
      function removeForce(){try{var u=new URL(location.href);u.searchParams.delete('welcome');history.replaceState(history.state,'',u.pathname+(u.search||'')+(location.hash||'#/'))}catch(e){}}
      function detachGestureGuards(){
        document.removeEventListener('touchmove',onTouchMove,true);document.removeEventListener('touchend',onTouchEnd,true);document.removeEventListener('touchcancel',onTouchCancel,true);
        document.removeEventListener('pointermove',onPointerMove);document.removeEventListener('pointerup',onPointerUp);document.removeEventListener('pointercancel',onPointerCancel)
      }
      function unlockHome(){
        if(!host)return;
        detachGestureGuards();
        host.style.pointerEvents='none';host.setAttribute('aria-hidden','true');
        document.documentElement.classList.remove('dlw8-on','dlw8-enter');document.documentElement.classList.add('dlw8-off');
        document.body.style.overflow='';document.body.style.touchAction='';document.documentElement.style.overflow='';
        window.__DLAVIE_WELCOME_ACTIVE__=false;
        if(host.parentNode)host.parentNode.removeChild(host);
        try{window.dispatchEvent(new CustomEvent('dlavie:welcome-complete'))}catch(e){}
      }
      function finish(){
        if(leaving)return;leaving=true;dragging=false;frame.classList.remove('scrubbing');start.classList.remove('dragging');render(1,true);label.textContent='Membuka DLavie…';
        try{localStorage.setItem(KEY,'done')}catch(e){}removeForce();prewarm();
        var root=document.getElementById('root'),done=false,observer=null;
        function open(){if(done)return;done=true;if(observer)observer.disconnect();unlockHome()}
        if(root&&root.childElementCount){open();return}
        if(root&&window.MutationObserver){observer=new MutationObserver(function(){if(root.childElementCount)open()});observer.observe(root,{childList:true,subtree:true})}
        setTimeout(open,1800)
      }
      window.addEventListener('resize',function(){setScene(progress,false)},{passive:true});
      setCopy(0);render(0,true)
    })();
  </script>
