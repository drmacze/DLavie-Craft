  <script>
    (function(){
      'use strict';
      var root=document.getElementById('root'),fail=document.getElementById('dl-app-fail');
      var appStarted=false,enhStarted=false;
      function loadEnh(){
        if(enhStarted)return;enhStarted=true;
        var s=document.createElement('script');s.src='/DLavie-Craft/assets/app-bootstrap-v1.js?v=20260907h1';s.defer=true;document.body.appendChild(s);
      }
      function watchRoot(){
        if(root&&root.childElementCount){loadEnh();return}
        if(root&&window.MutationObserver){var m=new MutationObserver(function(){if(root.childElementCount){m.disconnect();loadEnh()}});m.observe(root,{childList:true,subtree:true})}
        setTimeout(function(){if(!root.childElementCount&&fail&&!window.__DLAVIE_WELCOME_ACTIVE__)fail.classList.add('show')},9000);
      }
      window.__DLAVIE_BOOT_APP__=function(){
        if(appStarted)return;appStarted=true;
        var l=document.createElement('link');l.rel='stylesheet';l.href='/DLavie-Craft/assets/index-BLlJjh3N.css';document.head.appendChild(l);
        var s=document.createElement('script');s.type='module';s.src='/DLavie-Craft/assets/index-DQVRunOM.js';s.onload=watchRoot;s.onerror=function(){if(fail&&!window.__DLAVIE_WELCOME_ACTIVE__)fail.classList.add('show')};document.head.appendChild(s);
        watchRoot();
      };
      if(!window.__DLAVIE_WELCOME_ACTIVE__)window.__DLAVIE_BOOT_APP__();
    })();
  </script>

  <script>
    (function(){
      'use strict';
      var host=document.getElementById('dl-welcome-v8');if(!host)return;
      if(!window.__DLAVIE_WELCOME_ACTIVE__){host.remove();return}
      var KEY='dlavie:welcome:v8',THRESHOLD=62,SLIDE_MS=4800,RESUME_MS=6200;
      var viewport=host.querySelector('.dlw8-viewport'),slides=[].slice.call(host.querySelectorAll('.dlw8-slide')),dots=[].slice.call(host.querySelectorAll('[data-dot]')),copyBox=host.querySelector('.dlw8-copy'),title=copyBox.querySelector('h1'),body=copyBox.querySelector('p'),start=host.querySelector('.dlw8-start'),range=start.querySelector('.dlw8-range'),label=start.querySelector('strong');
      var text=[['Temukan mod yang selalu kamu cari.','Jelajahi mod, add-on, map, skin, shader dan project Minecraft pilihan dalam satu tempat.'],['Bangun dan bagikan duniamu.','Temukan karya komunitas atau aktifkan akun Crafter untuk mempublikasikan projectmu sendiri.'],['Mainkan lebih banyak, gratis.','Simpan favorit, download build terbaru, beri rating dan temukan creator baru.']];
      var index=0,timer=0,resume=0,leaving=false,drag=null;
      function w(){return Math.max(1,viewport.clientWidth)}
      function paint(i){
        i=Math.max(0,Math.min(slides.length-1,i));if(i===index&&title.textContent===text[i][0])return;index=i;
        slides.forEach(function(s,n){s.classList.toggle('active',n===i)});dots.forEach(function(d,n){d.classList.toggle('active',n===i)});
        title.textContent=text[i][0];body.textContent=text[i][1];
      }
      function go(i,manual){i=(i+slides.length)%slides.length;paint(i);try{viewport.scrollTo({left:i*w(),behavior:'smooth'})}catch(e){viewport.scrollLeft=i*w()}manual?pause():restart()}
      function restart(){clearTimeout(timer);timer=setTimeout(function(){go(index+1,false)},SLIDE_MS)}
      function pause(){clearTimeout(timer);clearTimeout(resume);resume=setTimeout(restart,RESUME_MS)}
      viewport.addEventListener('scroll',function(){var n=Math.round(viewport.scrollLeft/w());if(n!==index)paint(n)},{passive:true});
      viewport.addEventListener('touchstart',pause,{passive:true});viewport.addEventListener('pointerdown',pause,{passive:true});
      dots.forEach(function(d,i){d.addEventListener('click',function(){go(i,true)})});
      function render(v,animate){
        v=Math.max(0,Math.min(100,Number(v)||0));var p=v/100;
        start.style.setProperty('--p',String(p));
        var travel=Math.max(0,start.clientWidth-56);var knob=start.querySelector('.dlw8-knob');
        knob.style.transition=animate?'transform .22s cubic-bezier(.22,.8,.2,1)':'none';
        knob.style.transform='translate3d('+(travel*p)+'px,0,0)';
        start.classList.toggle('ready',v>=THRESHOLD);
        label.textContent=v>=THRESHOLD?'Lepas untuk masuk':(v>7?'Terus geser…':'Swipe to Start');
      }
      function prewarm(){if(window.__DLAVIE_BOOT_APP__)window.__DLAVIE_BOOT_APP__()}
      function settle(){if(leaving)return;var v=Number(range.value)||0;if(v>=THRESHOLD){finish();return}range.value='0';render(0,true);restart()}
      range.addEventListener('input',function(){prewarm();clearTimeout(timer);render(range.value,false)});
      range.addEventListener('change',settle);
      range.addEventListener('touchstart',function(){prewarm();clearTimeout(timer);var r=start.getBoundingClientRect();drag={left:r.left,width:r.width};},{passive:true});
      start.addEventListener('touchmove',function(e){if(!drag)return;var t=e.touches&&e.touches[0];if(!t)return;if(e.cancelable)e.preventDefault();var v=((t.clientX-drag.left-23)/Math.max(1,drag.width-46))*100;range.value=String(Math.max(0,Math.min(100,v)));render(range.value,false)},{passive:false,capture:true});
      start.addEventListener('touchend',function(){if(!drag)return;drag=null;setTimeout(settle,0)},{passive:true,capture:true});
      start.addEventListener('touchcancel',function(){if(!drag)return;drag=null;range.value='0';render(0,true);restart()},{passive:true,capture:true});
      var pdrag=null;
      start.addEventListener('pointerdown',function(e){if(e.pointerType==='touch')return;prewarm();var r=start.getBoundingClientRect();pdrag={left:r.left,width:r.width};try{start.setPointerCapture(e.pointerId)}catch(x){}},{passive:true});
      start.addEventListener('pointermove',function(e){if(!pdrag||e.pointerType==='touch')return;var v=((e.clientX-pdrag.left-23)/Math.max(1,pdrag.width-46))*100;range.value=String(Math.max(0,Math.min(100,v)));render(range.value,false)});
      start.addEventListener('pointerup',function(e){if(!pdrag||e.pointerType==='touch')return;pdrag=null;settle()});
      function removeForce(){try{var u=new URL(location.href);u.searchParams.delete('welcome');history.replaceState(history.state,'',u.pathname+(u.search||'')+(location.hash||'#/'))}catch(e){}}
      function exitWelcome(){host.classList.add('leaving');document.documentElement.classList.add('dlw8-enter');setTimeout(function(){if(host.parentNode)host.parentNode.removeChild(host);window.__DLAVIE_WELCOME_ACTIVE__=false;document.documentElement.classList.remove('dlw8-on','dlw8-enter');document.documentElement.classList.add('dlw8-off');try{window.dispatchEvent(new CustomEvent('dlavie:welcome-complete'))}catch(e){}},500)}
      function finish(){
        if(leaving)return;leaving=true;clearTimeout(timer);clearTimeout(resume);range.value='100';render(100,true);label.textContent='Membuka DLavie…';prewarm();
        try{localStorage.setItem(KEY,'done')}catch(e){}removeForce();
        var waited=0,iv=setInterval(function(){waited+=80;if((root&&root.childElementCount)||waited>=3600){clearInterval(iv);exitWelcome()}},80);
      }
      paint(0);render(0,true);restart();
    })();
  </script>
